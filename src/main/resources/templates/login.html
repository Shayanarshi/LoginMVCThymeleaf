<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Login Demo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            padding: 40px;

            background: white;
            border-radius: 16px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #222;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;
            font-size: 14px;

            margin-bottom: 28px;
        }

        .message {
            background: #ffecec;
            color: #d63031;

            padding: 11px;

            border-radius: 7px;

            font-size: 13px;

            margin-bottom: 20px;

            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;

            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            opacity: 0.9;

            transform: translateY(-1px);
        }

        .bottom {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #777;
        }

        .bottom a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        LM
    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to your account
    </p>

    <!-- Login error message -->
    <div class="message"
         th:if="${message}"
         th:text="${message}">
    </div>

    <form th:action="@{/login}"
          th:object="${user}"
          method="post">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="Enter your email"
                   required>

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="Enter your password"
                   required>

        </div>

        <button type="submit"
                class="login-btn">
            Login
        </button>

    </form>

    <div class="bottom">

        Don't have an account?

        <a th:href="@{/register}">
            Register
        </a>

        <br><br>

        <a th:href="@{/}">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
