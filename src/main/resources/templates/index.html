<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Demo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            padding: 45px 40px;

            background: white;
            border-radius: 16px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        h2 {
            color: #222;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;

            padding: 13px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 15px;
            font-weight: bold;

            transition: 0.3s;
        }

        .login {
            background: #667eea;
            color: white;
        }

        .login:hover {
            background: #5568d9;
        }

        .register {
            background: #f1f3ff;
            color: #667eea;
        }

        .register:hover {
            background: #e2e5ff;
        }

        .footer {
            margin-top: 30px;

            font-size: 12px;
            color: #aaa;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        LM
    </div>

    <h2>Welcome to Login Demo</h2>

    <p class="subtitle">
        Login or create an account to continue
    </p>

    <div class="buttons">

        <a class="btn login"
           th:href="@{/login}">
            Login
        </a>

        <a class="btn register"
           th:href="@{/register}">
            Register
        </a>

    </div>

    <div class="footer">
        <span>Designed & Developed by</span>
        <br>
        <strong>Shayan Arshi</strong>
        <br>
        <small>Java · Spring Boot · Thymeleaf · JPA</small>
    </div>

</div>

</body>

</html>
