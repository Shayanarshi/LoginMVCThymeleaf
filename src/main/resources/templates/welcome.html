<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Login Demo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 430px;
            padding: 45px 40px;

            background: white;
            border-radius: 16px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .welcome-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 32px;

            font-weight: bold;
        }

        h2 {
            color: #222;

            font-size: 26px;

            margin-bottom: 12px;
        }

        .username {
            color: #667eea;

            font-weight: bold;
        }

        .message {
            color: #666;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 30px;
        }

        .status {
            display: inline-block;

            padding: 8px 16px;

            border-radius: 20px;

            background: #e8f8ee;

            color: #20a05a;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 25px;
        }

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .btn {
            display: block;

            padding: 13px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition: 0.3s;
        }

        .home-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
        }

        .home-btn:hover {
            opacity: 0.9;

            transform: translateY(-1px);
        }

        .login-btn {
            background: #f1f3ff;

            color: #667eea;
        }

        .login-btn:hover {
            background: #e2e5ff;
        }

        .footer {
            margin-top: 28px;

            font-size: 12px;

            color: #aaa;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="welcome-icon">
        ✓
    </div>

    <span class="status">
        Login Successful
    </span>

    <h2>
        Welcome,
        <span class="username"
              th:text="${username}">
            User
        </span>
    </h2>

    <p class="message">
        You have successfully logged in to your account.
        <br>
        Welcome to the Login Demo application.
    </p>

    <div class="buttons">

        <a class="btn home-btn"
           th:href="@{/}">
            Back to Home
        </a>

        <a class="btn login-btn"
           th:href="@{/login}">
            Login Again
        </a>

    </div>

    <div class="footer">
        LoginMVC · Spring Boot · Thymeleaf
    </div>

</div>

</body>

</html>
